rubrics:
  - id: 1
    type: f2p
    text: "一次自动保存先固定会话集合和保存代际，发布过程中新增或消失的会话不会混入本轮。"
  - id: 2
    type: f2p
    text: "任一会话捕获或候选写入失败时，所有会话仍可从上一代完整恢复。"
  - id: 3
    type: f2p
    text: "单会话 JSON、对应滚屏文件和索引记录只会共同切换到本轮，不暴露跨代组合。"
  - id: 4
    type: f2p
    text: "滚屏目录已换代而后续 JSON 或索引失败时，恢复动作不会删除上一代唯一可用数据。"
  - id: 5
    type: f2p
    text: "守护进程在任意发布阶段退出后，下一次运行会继续或回退同一代际并移除残留临时资源。"
  - id: 6
    type: f2p
    text: "重复处理同一保存代际不会制造重复索引、孤立滚屏目录或多份活动快照。"
  - id: 7
    type: f2p
    text: "手工单会话保存仍只影响目标会话，并与后台保存的代际边界正确协同。"
  - id: 8
    type: p2p
    text: "禁用滚屏、空会话列表和正常自动保存保持原有结果。"
