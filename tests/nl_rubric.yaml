rubrics:
  - id: 1
    type: f2p
    text: "同一交互式恢复使用稳定代际，重试和重启不会为已确认窗口或 pane 再创建副本。"
  - id: 2
    type: f2p
    text: "取消信号会停止尚未开始的 tmux、agent 和滚屏步骤，迟到结果不能提交到已取消代际。"
  - id: 3
    type: f2p
    text: "新建会话中的部分 tmux 资源按已记录的创建确认清理，杀除失败时保留可恢复残留而不是宣告取消完成。"
  - id: 4
    type: f2p
    text: "原本已存在的会话只撤销本次新增资源，不会因取消被整体杀除。"
  - id: 5
    type: f2p
    text: "agent 恢复命令确认丢失时保留对应 pending token，恢复后只重放未确认 pane 并正确完成确认。"
  - id: 6
    type: f2p
    text: "tmux 已完成而访问时间或客户端切换失败时，再次执行只补后续阶段，不重建会话。"
  - id: 7
    type: f2p
    text: "进程重启能够识别未完成或清理中的恢复代际，继续恢复、清理或交接到单一结论。"
  - id: 8
    type: p2p
    text: "无动画恢复、完整成功、快照缺失和既有 SessionExists 行为保持兼容。"
